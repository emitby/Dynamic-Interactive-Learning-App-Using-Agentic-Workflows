# Render Blueprint: Study Sprint as a public live demo.
# Deploy: Render dashboard > New > Blueprint > pick this repository.
#
# Runs in demo mode (bundled sample lessons, no API key), so a public URL
# can't spend Anthropic credits. The CLI binds to 127.0.0.1 for local safety;
# Render must reach the app on 0.0.0.0:$PORT, so the start command calls
# uvicorn directly instead of `python -m studysprint serve`.
services:
  - type: web
    name: study-sprint
    runtime: python
    plan: free
    # Editable install, as in the README: studysprint.paths resolves the
    # static files and fixtures relative to the repository checkout.
    buildCommand: pip install --no-cache-dir -r requirements.txt -e .
    startCommand: >-
      python -c "import sys, uvicorn;
      from studysprint.api import create_app;
      uvicorn.run(create_app(demo=True), host='0.0.0.0', port=int(sys.argv[1]), log_level='warning')"
      $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7          # newest version the CI matrix tests
      - key: PYTHONPYCACHEPREFIX
        value: .cache/pycache  # keep bytecode inside the project, like the launchers
