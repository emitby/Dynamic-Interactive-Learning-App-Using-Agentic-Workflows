# Offline evals on every push: free, deterministic, no API key.
# Guardrail red-team (45 cases); lesson scorers run on saved builds and in the live matrix.
# Live trials with the real agents cost money and run locally: see docs/evals.md.
name: Evals

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      # Same as the launchers: keep caches inside the workspace.
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/pycache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir -r requirements.txt -e .
      - name: Guardrail red-team
        run: python -m evals.run_evals
